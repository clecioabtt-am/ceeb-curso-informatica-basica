name = "ceeb-curso-informatica-basica"
main = "src/worker.js"
compatibility_date = "2026-09-15"

[assets]
directory = "./public"
binding = "ASSETS"

[[r2_buckets]]
binding = "COURSE_FILES"
bucket_name = "ceeb-curso-basico-files"

# Configure ADMIN_PASSWORD como Secret no painel Cloudflare.
# Não coloque senhas em arquivos versionados no GitHub.
# Para persistência global das edições, configure separadamente o D1 COURSE_DB.

# Ative o D1 informando o ID real do banco no Cloudflare:
# Configure o vínculo COURSE_DB usando o nome e o ID do seu banco D1 real.
