
name = "ceeb-curso-informatica-basica"
main = "src/worker.js"
compatibility_date = "2026-09-15"

# Arquivos do site
[assets]
directory = "./public"
binding = "ASSETS"

# Armazenamento R2 - Videoaulas
[[r2_buckets]]
binding = "COURSE_FILES"
bucket_name = "ceeb-curso-basico-files"

# Banco de dados D1
[[d1_databases]]
binding = "COURSE_DB"
database_name = "ceeb-curso-basico-db"
database_id = "COLOQUE_AQUI_O_UUID_DO_D1"

# Variáveis Secret configuradas no Cloudflare:
# ADMIN_PASSWORD
# ADMIN_SESSION_SECRET
#
# Nunca coloque senhas diretamente neste arquivo.
